name: joybeat-mid-autumn
services:
  web:
    image: nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: joybeat-mid-autumn
    restart: unless-stopped
    depends_on:
      analytics:
        condition: service_healthy
    volumes:
      - /srv/apps/mid-autumn:/site:ro
      - /srv/apps/mid-autumn/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - coolify
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  analytics:
    image: python:3.12-alpine@sha256:4c47124a8391cb7a9f571164147d154777cf012a4ece5f86097130d7a4478111
    container_name: joybeat-mid-autumn-analytics
    restart: unless-stopped
    env_file:
      - /srv/apps/mid-autumn/analytics.env
    volumes:
      - /srv/apps/mid-autumn/analytics:/app:ro
      - /srv/apps/mid-autumn/data:/data
    command: ["python", "/app/server.py"]
    networks:
      - coolify
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks:
  coolify:
    external: true
