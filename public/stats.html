<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>心意卡统计 · 月下寄心意</title>
<style>
:root{font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#344d3e;background:#f6f4ed}*{box-sizing:border-box}body{margin:0;padding:24px 18px 50px}.wrap{max-width:820px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:20px 0 32px}h1{font-family:"Songti SC",serif;font-size:30px;letter-spacing:2px;margin:0}.brand{color:#9a845d;font-size:13px}.intro{font-size:16px;line-height:1.8;color:#60715e;margin:0 0 25px}.panel{background:#fffdf7;border:1px solid #dfd9c8;box-shadow:0 12px 28px #65715c10;border-radius:12px;padding:24px;margin-bottom:18px}.login{max-width:440px;margin:50px auto}.login h2{font-size:21px;margin:0 0 15px}.login label{display:block;margin-bottom:9px;font-size:15px}.login input{width:100%;height:48px;border:1px solid #aab5a6;border-radius:6px;padding:0 12px;font-size:18px}.button{background:#536a52;color:white;border:0;border-radius:6px;min-height:45px;padding:0 20px;font-size:15px;cursor:pointer}.login .button{width:100%;margin-top:16px}.error{color:#ac3f3f;min-height:23px;font-size:14px}.actions{display:flex;justify-content:flex-end;margin-bottom:13px;gap:10px}.actions button{border:1px solid #b5c0ad;background:transparent;color:#435846;border-radius:6px;padding:8px 13px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.metric{padding:20px;background:#f8f7f0;border-radius:8px}.metric span{display:block;font-size:14px;color:#657663}.metric strong{display:block;margin:10px 0 3px;font-size:34px;font-weight:600;color:#354e3d}.metric small{font-size:12px;color:#738273}.section-title{font-size:20px;margin:0 0 16px}.rows{display:grid;gap:10px}.row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e9e9df;padding:8px 0;font-size:16px}.row:last-child{border:0}.row strong{font-size:21px}.hint{font-size:13px;line-height:1.7;color:#72806e;margin:15px 0 0}.time{font-size:12px;color:#7a8877;text-align:right;margin-top:14px}@media(max-width:540px){header{align-items:flex-start}h1{font-size:25px}.brand{font-size:11px}.panel{padding:18px}.grid{gap:9px}.metric{padding:16px}.metric strong{font-size:28px}.metric span{font-size:13px}}
</style></head><body><div class="wrap"><header><h1>心意卡统计</h1><span class="brand">月下寄心意 · 岩火AI教育</span></header><p class="intro">看看有多少份中秋心意被写下、分享，又被远方的人打开。</p>
<section class="panel login" id="login"><h2>输入访问口令</h2><label for="password">只有持有口令的人能查看统计</label><input id="password" type="password" autocomplete="current-password" placeholder="访问口令"><button class="button" id="sign-in">查看统计</button><p class="error" id="error" role="alert"></p></section>
<div id="dashboard" hidden><div class="actions"><button id="refresh">刷新数据</button><button id="sign-out">退出</button></div><section class="panel"><h2 class="section-title">总览</h2><div class="grid" id="metrics"></div><p class="hint">制作人数和分享人数按浏览器匿名标识估算，同一个人使用不同设备可能重复计算。“分享操作”包括复制链接、使用系统分享、下载海报；并不能证明消息已发出。“被他人打开”表示另一浏览器打开了卡片链接。</p><p class="time" id="as-of"></p></section><section class="panel"><h2 class="section-title">三类祝福</h2><div class="rows" id="audiences"></div></section><section class="panel"><h2 class="section-title">分享方式</h2><div class="rows" id="methods"></div></section></div></div>
<script>
const $=id=>document.getElementById(id), labels={friend:'致朋友',elder:'致前辈',teacher:'致师长'};
let token=sessionStorage.getItem('moonlit-stats-token')||'';
function row(name,value){const div=document.createElement('div');div.className='row';const a=document.createElement('span');a.textContent=name;const b=document.createElement('strong');b.textContent=String(value);div.append(a,b);return div}
function metric(name,value,note){const div=document.createElement('div');div.className='metric';const a=document.createElement('span');a.textContent=name;const b=document.createElement('strong');b.textContent=String(value);const c=document.createElement('small');c.textContent=note;div.append(a,b,c);return div}
async function load(){if(!token)return;try{const response=await fetch('/api/stats',{headers:{Authorization:'Bearer '+token},cache:'no-store'});if(!response.ok)throw new Error(response.status===401?'访问口令不正确':'暂时无法读取统计');const data=await response.json();$('login').hidden=true;$('dashboard').hidden=false;$('error').textContent='';sessionStorage.setItem('moonlit-stats-token',token);const s=data.summary;$('metrics').replaceChildren(metric('制作人数',s.creators,'匿名浏览器数'),metric('制作并操作分享人数',s.creatorSharers,'匿名浏览器数'),metric('制作卡片',s.cards,'张'),metric('分享操作次数',s.shareActions,'次'),metric('被分享的卡片',s.cardsShared,'张'),metric('被他人打开的卡片',s.cardsOpenedByOthers,'张'));$('audiences').replaceChildren(...Object.entries(labels).map(([key,label])=>{const a=data.byAudience.find(x=>x.audience===key)||{};return row(label,`${a.cards||0} 张制作 · ${a.cardsShared||0} 张分享 · ${a.cardsOpenedByOthers||0} 张被他人打开`)}));$('methods').replaceChildren(row('复制链接',data.byMethod.share_copy||0),row('系统分享',data.byMethod.share_native||0),row('下载海报',data.byMethod.share_poster||0));$('as-of').textContent='更新于 '+new Date(data.asOf).toLocaleString('zh-CN');}catch(error){$('login').hidden=false;$('dashboard').hidden=true;$('error').textContent=error.message;sessionStorage.removeItem('moonlit-stats-token')}}
$('sign-in').onclick=()=>{token=$('password').value.trim();load()};$('password').onkeydown=e=>{if(e.key==='Enter')$('sign-in').click()};$('refresh').onclick=load;$('sign-out').onclick=()=>{token='';sessionStorage.removeItem('moonlit-stats-token');$('dashboard').hidden=true;$('login').hidden=false;$('password').value=''};load();
</script></body></html>
